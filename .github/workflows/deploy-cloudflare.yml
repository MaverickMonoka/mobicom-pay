name: Deploy Mobicom Pay to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify Cloudflare token
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing" && exit 1)
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Using configured Cloudflare account."
            exit 0
          fi
          response="$(curl -fsS https://api.cloudflare.com/client/v4/accounts             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"
          account_id="$(printf '%s' "$response" | jq -r '.result[0].id // empty')"
          if [ -z "$account_id" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID as a repository secret, or recreate the API token with Account read + Workers Scripts edit."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run worker:check
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
